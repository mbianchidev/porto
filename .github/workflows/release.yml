name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v1.2.3'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          version="${tag#v}"
          if [[ "$tag" != v* || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag must be a valid SemVer prefixed with v, got '${tag}'"
            exit 1
          fi

          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease_version="${version_without_build#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease_version"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                echo "::error::Numeric pre-release identifiers must not contain leading zeroes: '${identifier}'"
                exit 1
              fi
            done
          fi

          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test
        run: go test ./... -count=1

      - name: Build dashboard
        run: |
          set -euo pipefail
          npm --prefix ui ci
          npm --prefix ui run lint
          npm --prefix ui run build
          npm --prefix ui/electron ci
          npm --prefix ui/electron audit
          npm --prefix ui/electron test
          node --check ui/electron/main.js
          node --check ui/electron/daemon-readiness.cjs
          node --check ui/electron/preload.js
          node --check ui/electron/package.cjs
          node --check scripts/desktop-runtime-symlinks.cjs
          bash -n scripts/bundle-desktop-runtime.sh
          sh -n scripts/install-desktop.sh

      - name: Package release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="porto_${VERSION}_${goos}_${goarch}"
            root="stage/${name}"
            binary="porto"
            if [ "$goos" = "windows" ]; then
              binary="porto.exe"
            fi

            echo "::group::${name}"
            mkdir -p "${root}/ui"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags '-s -w' -o "${root}/${binary}" ./cmd/porto
            cp -R ui/dist "${root}/ui/dist"
            cp README.md LICENSE "${root}/"

            # The daemon serves the dashboard from <binary dir>/ui/dist, so it must ship with the binary.
            test -f "${root}/ui/dist/index.html"
            test -f "${root}/${binary}"

            if [ "$goos" = "windows" ]; then
              (cd stage && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C stage "${name}"
            fi

            electron_arch="$goarch"
            if [ "$goarch" = "amd64" ]; then
              electron_arch="x64"
            fi
            electron_platform="$goos"
            if [ "$goos" = "windows" ]; then
              electron_platform="win32"
            fi
            desktop_name="porto-desktop_${VERSION}_${goos}_${goarch}"
            desktop_version="${VERSION%%[-+]*}"
            runtime_dir="$GITHUB_WORKSPACE/stage/runtime"
            bash scripts/bundle-desktop-runtime.sh "$goos" "$goarch" "$runtime_dir"
            test -f "$runtime_dir/VERSIONS"
            rm -rf ui/electron/release
            (
              cd ui/electron
              node package.cjs \
                --platform="$electron_platform" \
                --arch="$electron_arch" \
                --out=release \
                --app-version="$desktop_version" \
                --build-version="$GITHUB_RUN_NUMBER" \
                --extra-resource="../../${root}/${binary}" \
                --extra-resource="../dist" \
                --extra-resource="$runtime_dir"
            )
            packaged_app="$(find ui/electron/release -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$packaged_app"
            test -n "$(find "$packaged_app" -path '*/runtime/VERSIONS' -print -quit)"
            node scripts/desktop-runtime-symlinks.cjs --validate "$packaged_app"
            mv "$packaged_app" "stage/${desktop_name}"
            if [ "$goos" = "windows" ]; then
              (cd stage && zip -qr "../dist/${desktop_name}.zip" "${desktop_name}")
            else
              tar -czf "dist/${desktop_name}.tar.gz" -C stage "${desktop_name}"
            fi
            echo "::endgroup::"
          done
          (cd dist && sha256sum porto*_* > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archives
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-archives
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/porto*_*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=(dist/porto*_*)
          if [ "${#archives[@]}" -ne 12 ] || [ ! -f dist/SHA256SUMS ]; then
            echo "::error::Expected twelve CLI/desktop release archives and SHA256SUMS"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)
          assets=(dist/SHA256SUMS "${archives[@]}")

          update_release() {
            echo "Updating existing release ${TAG}"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" \
              --verify-tag \
              --title "Porto ${TAG}" \
              --draft=false \
              --prerelease="$PRERELEASE"
          }

          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            update_release
            exit 0
          fi

          args=(--verify-tag --generate-notes --title "Porto ${TAG}")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          if ! gh release create "$TAG" "${args[@]}" "${assets[@]}"; then
            # Another run may have created the release after the existence check.
            if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
              update_release
            else
              exit 1
            fi
          fi
