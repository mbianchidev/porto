name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v1.2.3'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z or vX.Y.Z-suffix, got '${tag}'"
            exit 1
          fi
          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test
        run: go test ./... -count=1

      - name: Build dashboard
        run: |
          set -euo pipefail
          npm --prefix ui ci
          npm --prefix ui run lint
          npm --prefix ui run build

      - name: Package release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="porto_${VERSION}_${goos}_${goarch}"
            root="stage/${name}"
            binary="porto"
            if [ "$goos" = "windows" ]; then
              binary="porto.exe"
            fi

            echo "::group::${name}"
            mkdir -p "${root}/ui"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags '-s -w' -o "${root}/${binary}" ./cmd/porto
            cp -R ui/dist "${root}/ui/dist"
            cp README.md LICENSE "${root}/"

            # The daemon serves the dashboard from <binary dir>/ui/dist, so it must ship with the binary.
            test -f "${root}/ui/dist/index.html"
            test -f "${root}/${binary}"

            if [ "$goos" = "windows" ]; then
              (cd stage && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C stage "${name}"
            fi
            echo "::endgroup::"
          done
          (cd dist && sha256sum porto_* > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archives
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-archives
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/porto_*'

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "Porto ${TAG}")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*
