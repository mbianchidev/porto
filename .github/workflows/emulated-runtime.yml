name: Emulated runtime acceptance

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Host for software-emulated Lima acceptance.
        type: choice
        default: all
        options:
          - all
          - ubuntu-26.04-arm
          - macos-26-intel
          - macos-latest
          - windows-2025
          - windows-11-arm
      phase:
        description: Full runtime phase to exercise.
        type: choice
        default: all
        options:
          - all
          - migration
          - native
          - engine

concurrency:
  group: emulated-runtime-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.phase }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-data:
    name: Emulated runtime (${{ matrix.phase }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-26.04-arm","macos-26-intel","macos-latest","windows-2025","windows-11-arm"]' || format('["{0}"]', inputs.platform)) }}
        phase: ${{ fromJSON(inputs.phase == 'all' && '["migration","native","engine"]' || format('["{0}"]', inputs.phase)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require ARM64 for the rolling macOS image
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" != ARM64 ]; then
            echo "::error::This emulated runtime row requires macOS ARM64, got $RUNNER_ARCH."
            exit 1
          fi
      - uses: ./.github/actions/runtime-data
        with:
          backend: lima
          phase: ${{ matrix.phase }}
