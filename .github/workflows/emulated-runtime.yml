name: Emulated runtime acceptance

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop host to exercise with a disposable Lima VM.
        type: choice
        default: all
        options:
          - all
          - macos-26-intel
          - macos-26
          - windows-2025
          - windows-11-arm
      phase:
        description: Full runtime phase to exercise.
        type: choice
        default: all
        options:
          - all
          - migration
          - native
          - engine

concurrency:
  group: emulated-runtime-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.phase }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-data:
    name: Emulated runtime (${{ matrix.phase }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["macos-26-intel","macos-26","windows-2025","windows-11-arm"]' || format('["{0}"]', inputs.platform)) }}
        phase: ${{ fromJSON(inputs.phase == 'all' && '["migration","native","engine"]' || format('["{0}"]', inputs.phase)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime-data
        with:
          backend: lima
          phase: ${{ matrix.phase }}
