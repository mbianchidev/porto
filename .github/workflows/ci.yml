name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Guard the minimum toolchain declared in go.mod.
          - os: ubuntu-latest
            go: '1.25.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Check gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/porto

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./... -count=1

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/install-desktop.ps1))
          $installRoot = 'C:\Program Files\Porto'
          $command = '"{0}" %*' -f (Join-Path $installRoot 'resources\porto.exe')
          if ($command -ne '"C:\Program Files\Porto\resources\porto.exe" %*') {
            throw "Invalid porto.cmd wrapper: $command"
          }

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/porto
            echo "::endgroup::"
          done

  ui:
    name: UI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported by Vite/oxlint, active LTS, and current.
        node: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate desktop shell
        run: |
          npm --prefix electron ci
          npm --prefix electron audit
          npm --prefix electron test
          node --check electron/main.js
          node --check electron/daemon-readiness.cjs
          node --check electron/preload.js
          node --check electron/package.cjs
          node --check ../scripts/desktop-runtime-symlinks.cjs

      - name: Validate release installers
        if: matrix.node == '24'
        working-directory: ${{ github.workspace }}
        run: |
          bash -n scripts/bundle-desktop-runtime.sh
          sh -n scripts/install-desktop.sh
