name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Guard the exact minimum Go version declared in go.mod.
          - os: ubuntu-latest
            go: '1.27.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}

      - name: Check gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Check crypto dependency policy
        run: node scripts/check-go-crypto.cjs

      - name: Build
        run: go build ./cmd/porto

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -failfast

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1 -failfast

      - name: Test unattached-volume migration against the runner Docker engine
        if: runner.os == 'Linux' && matrix.go == 'stable'
        env:
          PORTO_TEST_MIGRATION_SOURCE_SOCKET: unix:///var/run/docker.sock
        run: go test ./internal/docker -run '^TestUnattachedVolumeMigrationRealDockerArchive$' -count=1 -failfast -timeout=5m -v

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/install-desktop.ps1))
          $installRoot = 'C:\Program Files\Porto'
          $command = '"{0}" %*' -f (Join-Path $installRoot 'resources\porto.exe')
          if ($command -ne '"C:\Program Files\Porto\resources\porto.exe" %*') {
            throw "Invalid porto.cmd wrapper: $command"
          }
          $dockerCommand = '"{0}" %*' -f (Join-Path $installRoot 'resources\runtime\bin\docker.exe')
          if ($dockerCommand -ne '"C:\Program Files\Porto\resources\runtime\bin\docker.exe" %*') {
            throw "Invalid docker.cmd wrapper: $dockerCommand"
          }
          $diveCommand = '"{0}" %*' -f (Join-Path $installRoot 'resources\runtime\bin\dive.exe')
          if ($diveCommand -ne '"C:\Program Files\Porto\resources\runtime\bin\dive.exe" %*') {
            throw "Invalid dive.cmd wrapper: $diveCommand"
          }

  platform-networking:
    name: Native HTTPS and console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, windows-11-arm]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: platform-networking
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux browser and trust prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates libnss3-tools
          npm --prefix ui ci
          cd ui
          npx --no-install playwright install --with-deps --no-shell chromium
      - name: Exercise real Linux systemd, NSS, renewal, rollback and browser trust
        if: runner.os == 'Linux'
        run: |
          go build -o "$RUNNER_TEMP/porto-native" ./cmd/porto
          go test -c -o "$RUNNER_TEMP/https-native-tests" ./internal/localhttps
          browser="$(node -e "process.stdout.write(require('./ui/node_modules/@playwright/test').chromium.executablePath())")"
          for native_test in TestNativePortlessHTTPSTrustRenewalAndOwnedRemoval TestNativePortlessHTTPSRealDaemonRestartAndRenewal; do
            sudo -E env "PATH=$PATH" \
              "PORTO_TEST_NATIVE_HTTPS=1" \
              "PORTO_TEST_HTTPS_BINARY=$RUNNER_TEMP/porto-native" \
              "PORTO_TEST_HTTPS_BROWSER=$browser" \
              "$RUNNER_TEMP/https-native-tests" -test.run "^$native_test$" -test.count=1 -test.failfast -test.timeout=5m -test.v
          done
      - name: Exercise real Windows service, native trust, browser and ConPTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PORTO_TEST_NATIVE_HTTPS = '1'
          $env:PORTO_TEST_HTTPS_BINARY = Join-Path $env:RUNNER_TEMP 'porto-native.exe'
          $browser = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Native HTTPS acceptance requires the installed Edge browser.' }
          $env:PORTO_TEST_HTTPS_BROWSER = $browser
          go build -o $env:PORTO_TEST_HTTPS_BINARY ./cmd/porto
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI build failed.' }
          foreach ($nativeTest in @('TestNativePortlessHTTPSTrustRenewalAndOwnedRemoval', 'TestNativePortlessHTTPSRealDaemonRestartAndRenewal')) {
            go test ./internal/localhttps -run "^$nativeTest`$" -count=1 -failfast -timeout=5m -v
            if ($LASTEXITCODE -ne 0) { throw "Native HTTPS acceptance failed: $nativeTest" }
          }
          go test ./internal/daemon -run 'TestHostPTY|TestPTYBridge|TestApplyTerminal' -count=1 -failfast -timeout=5m -v
          if ($LASTEXITCODE -ne 0) { throw 'Native ConPTY acceptance failed.' }

  native-windows-containers:
    name: Native Windows containers (windows-2025/amd64)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          cache-scope: native-windows-containers

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: ./.github/actions/cache-desktop
        with:
          target: native-windows-containers-amd64

      - name: Build only the native Windows payload
        shell: bash
        run: |
          set -euo pipefail
          native_runtime="$RUNNER_TEMP/porto-native-windows-runtime"
          bash scripts/bundle-windows-containers.sh amd64 "$native_runtime"
          echo "PORTO_WINDOWS_RUNTIME_DIR=$(cygpath -w "$native_runtime/bin")" >> "$GITHUB_ENV"

      - name: Exercise owned native Windows containers and safe mode boundaries
        shell: pwsh
        env:
          PORTO_TEST_NATIVE_WINDOWS_CONTAINERS: '1'
          PORTO_TEST_WINDOWS_IMAGE: mcr.microsoft.com/windows/nanoserver:ltsc2025@sha256:4d81c65bfec7e1b00e004ba8d7306347a880935179bc20cae1044b5a7d35f789
        run: |
          $env:PORTO_TEST_WINDOWS_BINARY = Join-Path $env:RUNNER_TEMP 'porto-native-windows.exe'
          go build -o $env:PORTO_TEST_WINDOWS_BINARY ./cmd/porto
          if ($LASTEXITCODE -ne 0) { throw 'Current native Windows CLI build failed.' }
          go test ./internal/windowscontainers ./internal/docker ./internal/daemon -run '^TestNativeWindowsContainers' -count=1 -failfast -timeout=20m -v
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows-container acceptance failed.' }

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          cache-scope: cross-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          node scripts/check-go-crypto.cjs
          go build -o /dev/null ./cmd/porto

      - name: Test runtime dependency policies
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: node --test scripts/check-go-crypto.test.cjs scripts/windows-container-toolchain.test.cjs

  linux-toolchain:
    name: Linux Docker toolchain (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          cache-scope: runtime-linux-${{ matrix.arch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          check-latest: true

      - uses: ./.github/actions/cache-desktop
        with:
          target: linux-${{ matrix.arch }}

      - name: Build checksum-pinned runtime
        run: bash scripts/bundle-desktop-runtime.sh linux "${{ matrix.arch }}" "$RUNNER_TEMP/runtime"

      - name: Run clean Compose smoke
        if: matrix.arch == 'amd64'
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/clean-docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG"
          PATH="$RUNNER_TEMP/runtime/bin:$PATH" \
            go test ./internal/docker -run '^TestDockerComposeUpUsesPortoNativeSocket$' -count=1 -failfast

  development-clients:
    name: Development clients (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            backend: local
          - os: ubuntu-latest
            backend: lima
          - os: macos-latest
            backend: lima
          - os: windows-latest
            backend: lima
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: development-${{ matrix.backend }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          cache-dependency-path: |
            scripts/docker-clients/package-lock.json
            ui/electron/package-lock.json
      - uses: ./.github/actions/cache-desktop
        with:
          target: development-${{ matrix.backend }}
      - name: Install and audit development clients
        shell: bash
        run: |
          npm --prefix scripts/docker-clients ci
          npm --prefix scripts/docker-clients audit
      - name: Install Windows runtime packaging dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: npm --prefix ui/electron ci
      - name: Install QEMU for software-emulated macOS CI
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Prepare native Linux Lima networking acceptance
        if: runner.os == 'Linux' && matrix.backend == 'lima'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl qemu-system-x86 qemu-utils
          test -c /dev/kvm
          sudo usermod -aG kvm "$(id -un)"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: Run real development workflows against Porto
        shell: bash
        run: |
          if [ "${{ matrix.backend }}" = local ]; then
            sudo -E env "PATH=$PATH" bash scripts/test-docker-clients.sh local
          elif [ "$RUNNER_OS" = Linux ]; then
            sg kvm -c 'bash scripts/test-docker-clients.sh lima'
          else
            bash scripts/test-docker-clients.sh lima
          fi

  runtime-data:
    name: Runtime data (${{ matrix.phase }}, ${{ matrix.runtime.backend }}, ${{ matrix.runtime.os }})
    runs-on: ${{ matrix.runtime.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: true
      matrix:
        phase: [migration, native, engine]
        runtime:
          - os: ubuntu-latest
            backend: local
          - os: ubuntu-26.04-arm
            backend: local
          - os: ubuntu-latest
            backend: lima
        exclude:
          - phase: engine
            runtime:
              os: ubuntu-latest
              backend: local
          - phase: engine
            runtime:
              os: ubuntu-26.04-arm
              backend: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require x64 for the rolling Linux image
        if: matrix.runtime.os == 'ubuntu-latest'
        run: |
          if [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::This runtime acceptance row requires Linux x64, got $RUNNER_ARCH."
            exit 1
          fi
      - name: Require hardware virtualization for the VM-backed gate
        if: matrix.runtime.backend == 'lima'
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::Required Lima acceptance needs KVM; software-emulated destinations belong in Emulated runtime acceptance."
            exit 1
          fi
      - uses: ./.github/actions/runtime-data
        with:
          backend: ${{ matrix.runtime.backend }}
          phase: ${{ matrix.phase }}

  native-files:
    name: Native filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [macos-26-intel, macos-latest, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require ARM64 for the rolling macOS image
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" != ARM64 ]; then
            echo "::error::This native filesystem row requires macOS ARM64, got $RUNNER_ARCH."
            exit 1
          fi
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: native-files
      - name: Exercise actual macOS native mounts without a VM
        if: runner.os == 'macOS'
        env:
          PORTO_TEST_WEBDAV_NATIVE: '1'
        run: go test ./internal/nativefiles -run '^TestMacOSNativeWebDAV' -count=1 -failfast -timeout=5m -v
      - name: Install the explicitly selected Windows native filesystem driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-winfsp-ci.ps1
      - name: Exercise actual Windows native mounts without a VM
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:RUNNER_TEMP 'porto-files-mount.exe'
          & go build -trimpath -o $helper ./cmd/porto-files-mount
          if ($LASTEXITCODE -ne 0) { throw 'Native filesystem helper build failed.' }
          $env:PORTO_TEST_NATIVE_MOUNT_HELPER = $helper
          $env:PORTO_TEST_WINFSP_NATIVE = '1'
          try {
            & go test ./internal/nativefiles -run '^TestWindowsNativeFoldersExposeDirectEditsReadonlyAndOwnedDetach$' -count=1 -failfast -timeout=10m -v
            if ($LASTEXITCODE -ne 0) { throw 'Native WinFsp filesystem checks failed.' }
          }
          finally {
            Remove-Item Env:PORTO_TEST_NATIVE_MOUNT_HELPER
            Remove-Item Env:PORTO_TEST_WINFSP_NATIVE
            Remove-Item -LiteralPath $helper -Force
          }

  ui:
    name: UI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: true
      matrix:
        # Minimum supported by Vite/oxlint, active LTS, and current.
        node: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui/electron/package-lock.json

      - uses: ./.github/actions/cache-desktop
        with:
          target: ui

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cache browser downloads
        if: matrix.node == '26'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: porto-playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install browser test dependencies
        if: matrix.node == '26'
        run: npx --no-install playwright install --with-deps --no-shell chromium

      - name: Test data dashboards
        if: matrix.node == '26'
        run: npm test -- --reporter=line --max-failures=1

      - name: Validate desktop shell
        run: |
          npm --prefix electron ci
          npm --prefix electron test
          node --check electron/main.js
          node --check electron/dev-launcher.cjs
          node --check electron/daemon-readiness.cjs
          node --check electron/desktop-update-install.cjs
          node --check electron/desktop-updater.cjs
          node --check electron/preload.js
          node --check electron/package.cjs
          bash -n electron/apply-update.sh
          node --check ../scripts/desktop-runtime-symlinks.cjs
          node --check ../scripts/macos-development-app.cjs

      - name: Audit desktop dependencies
        if: matrix.node == '26'
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT
          if npm --prefix electron audit --package-lock-only --audit-level=high 2>&1 | tee "$audit_log"; then
            exit 0
          fi
          if grep -Eq 'npm warn audit (network timeout|429 |500 |502 |503 |504 )|ECONNRESET|ETIMEDOUT|EAI_AGAIN' "$audit_log"; then
            echo "::warning::npm registry audit endpoint unavailable; dependency installation completed without reported vulnerabilities."
            exit 0
          fi
          exit 1

      - name: Validate release installers
        if: matrix.node == '26'
        working-directory: ${{ github.workspace }}
        run: |
          bash -n scripts/download-file.sh
          bash -n scripts/bundle-desktop-runtime.sh
          bash -n scripts/package-desktop-installer.sh
          sh -n scripts/install-desktop.sh

  native-installers:
    name: Native installers (${{ matrix.goos }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            arch: amd64
          - os: macos-latest
            goos: darwin
            arch: arm64
          - os: windows-latest
            goos: windows
            arch: amd64
          - os: windows-latest
            goos: windows
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          cache-scope: native-${{ matrix.goos }}-${{ matrix.arch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui/electron/package-lock.json

      - uses: ./.github/actions/cache-desktop
        with:
          target: ${{ matrix.goos }}-${{ matrix.arch }}

      - name: Build desktop inputs
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix ui/electron ci
          node --test ui/electron/desktop-logging.test.cjs scripts/macos-startup.test.cjs

      - name: Validate Windows update helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw ui/electron/apply-update.ps1)) | Out-Null'

      - name: Build native installers
        id: installers
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./ui/package.json').version.split('+')[0]")+ci.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          bash scripts/package-desktop-installer.sh "$GOOS" "$GOARCH" "$version" dist
          if [ "$GOOS" = windows ]; then
            test "$(find dist -maxdepth 1 -name '*.exe' | wc -l | tr -d ' ')" = "1"
            test -f "dist/porto-desktop_${version}_windows_${GOARCH}.exe"
          fi

      - name: Verify DMGs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          for image in dist/*.dmg; do
            hdiutil verify "$image"
          done

      - name: Install and uninstall Windows package
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          $installer = Get-Item 'dist/porto-desktop_${{ steps.installers.outputs.version }}_windows_amd64.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'Porto installer smoke'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Porto.lnk'
          $desktopShortcutExisted = Test-Path $desktopShortcut
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)."
          }
          if (-not $desktopShortcutExisted -and (Test-Path $desktopShortcut)) {
            throw 'Silent installation created a desktop shortcut.'
          }
          if (-not (Test-Path (Join-Path $installRoot 'Porto.exe'))) {
            throw 'Installer did not create Porto.exe.'
          }
          if (-not (Test-Path (Join-Path $installRoot 'resources/porto.exe'))) {
            throw 'Installer did not include the Porto CLI.'
          }
          if (-not (Test-Path (Join-Path $installRoot 'resources/runtime/VERSIONS'))) {
            throw 'Installer did not include the desktop runtime.'
          }
          $docker = Join-Path $installRoot 'resources/runtime/bin/docker.exe'
          $dockerConfig = Join-Path $env:RUNNER_TEMP 'Porto clean Docker config'
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          $oldDockerConfig = $env:DOCKER_CONFIG
          $oldPath = $env:PATH
          $env:DOCKER_CONFIG = $dockerConfig
          $env:PATH = "$(Split-Path $docker);$oldPath"
          try {
            & $docker --version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed Docker CLI failed.' }
            & $docker compose version --short | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed Docker Compose plugin failed.' }
            & $docker buildx version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed Docker Buildx plugin failed.' }
            $dive = Join-Path $installRoot 'resources/runtime/bin/dive.exe'
            & $dive --version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed Dive image inspector failed.' }
            go test ./internal/docker -run '^TestDockerComposeUpUsesPortoNativeSocket$' -count=1 -failfast
            if ($LASTEXITCODE -ne 0) { throw 'Installed Docker Compose failed the Porto API smoke test.' }
          }
          finally {
            $env:DOCKER_CONFIG = $oldDockerConfig
            $env:PATH = $oldPath
          }
          $qemuImg = Join-Path $installRoot 'resources/runtime/qemu/qemu-img.exe'
          $qemuSystem = Join-Path $installRoot 'resources/runtime/qemu/qemu-system-x86_64.exe'
          foreach ($binary in @($qemuImg, $qemuSystem)) {
            if (-not (Test-Path $binary)) {
              throw "Installer did not include $binary."
            }
            & $binary --version | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "$binary exited with code $LASTEXITCODE."
            }
          }
          $limactl = Join-Path $installRoot 'resources/runtime/lima/bin/limactl.exe'
          & node scripts/lima-runtime-smoke.cjs $limactl
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed Lima failed the process-state recovery checks.'
          }
          & ./scripts/install-winfsp-ci.ps1
          $env:PORTO_TEST_NATIVE_MOUNT_HELPER = Join-Path $installRoot 'resources/runtime/bin/porto-files-mount.exe'
          $env:PORTO_TEST_WINFSP_NATIVE = '1'
          try {
            & go test ./internal/nativefiles -run '^TestWindowsNativeFoldersExposeDirectEditsReadonlyAndOwnedDetach$' -count=1 -failfast -timeout=10m -v
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed Porto native WinFsp folder bridge failed direct-edit/read-only/detach checks.'
            }
          }
          finally {
            Remove-Item Env:PORTO_TEST_NATIVE_MOUNT_HELPER
            Remove-Item Env:PORTO_TEST_WINFSP_NATIVE
          }
          $env:PORTO_TEST_DAEMON = Join-Path $installRoot 'resources/porto.exe'
          try {
            & node --test ui/electron/desktop-logging.test.cjs
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed Porto failed the persistent logging checks.'
            }
          }
          finally {
            Remove-Item Env:PORTO_TEST_DAEMON
          }
          $scriptPath = (Resolve-Path './ui/electron/apply-update.ps1').Path
          $blockedUpdatePackage = Join-Path $env:RUNNER_TEMP 'Porto blocked update package.exe'
          $blockedUpdateError = Join-Path $env:RUNNER_TEMP 'Porto blocked update error.txt'
          $blockedUpdateReady = Join-Path $env:RUNNER_TEMP 'Porto blocked update ready.txt'
          $blockedUpdateProceed = Join-Path $env:RUNNER_TEMP 'Porto blocked update proceed.txt'
          Copy-Item $installer.FullName $blockedUpdatePackage
          Remove-Item $blockedUpdateError, $blockedUpdateReady, $blockedUpdateProceed -Force -ErrorAction SilentlyContinue
          $qemuBlocker = Start-Process `
            -FilePath $qemuSystem `
            -ArgumentList '-machine none -nodefaults -display none -monitor none -serial none -S' `
            -PassThru `
            -WindowStyle Hidden
          try {
            Start-Sleep -Milliseconds 500
            if ($qemuBlocker.HasExited) {
              throw "QEMU update blocker exited with code $($qemuBlocker.ExitCode)."
            }
            $blockedUpdateArguments = @(
              '-NoProfile',
              '-NonInteractive',
              '-ExecutionPolicy', 'Bypass',
              '-File', "`"$scriptPath`"",
              '-ParentPid', '2147483647',
              '-PackagePath', "`"$blockedUpdatePackage`"",
              '-InstallDirectory', "`"$installRoot`"",
              '-ExecutablePath', "`"$(Join-Path $installRoot 'Porto.exe')`"",
              '-ErrorFile', "`"$blockedUpdateError`"",
              '-ReadyFile', "`"$blockedUpdateReady`"",
              '-ProceedFile', "`"$blockedUpdateProceed`"",
              '-SkipRestart'
            )
            $blockedUpdate = Start-Process powershell.exe -ArgumentList $blockedUpdateArguments -PassThru -WindowStyle Hidden
            $blockedUpdate.WaitForExit()
            if ($blockedUpdate.ExitCode -eq 0) {
              throw 'Update helper accepted a running QEMU workload.'
            }
            if (Test-Path $blockedUpdateReady) {
              throw 'Update helper signaled readiness before rejecting a running QEMU workload.'
            }
            if (-not (Test-Path $blockedUpdateError)) {
              throw 'Update helper did not report the blocking QEMU workload.'
            }
            $blockedUpdateMessage = Get-Content -Raw $blockedUpdateError
            if ($blockedUpdateMessage -notmatch 'Stop running Porto VMs and Kubernetes clusters before updating') {
              throw "Unexpected QEMU blocker error: $blockedUpdateMessage"
            }
            if ($qemuBlocker.HasExited) {
              throw 'Update helper terminated the running QEMU workload.'
            }
          }
          finally {
            Stop-Process -Id $qemuBlocker.Id -Force -ErrorAction SilentlyContinue
            $qemuBlocker.WaitForExit()
            @(
              $blockedUpdatePackage
              "$blockedUpdatePackage.install.log"
              $blockedUpdateError
              $blockedUpdateReady
              $blockedUpdateProceed
            ) | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          $updatePackage = Join-Path $env:RUNNER_TEMP 'Porto update package.exe'
          $updateError = Join-Path $env:RUNNER_TEMP 'Porto update error.txt'
          $updateReady = Join-Path $env:RUNNER_TEMP 'Porto update ready.txt'
          $updateProceed = Join-Path $env:RUNNER_TEMP 'Porto update proceed.txt'
          Copy-Item $installer.FullName $updatePackage
          Remove-Item $updateReady, $updateProceed -Force -ErrorAction SilentlyContinue
          $updateArguments = @(
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy', 'Bypass',
            '-File', "`"$scriptPath`"",
            '-ParentPid', '2147483647',
            '-PackagePath', "`"$updatePackage`"",
            '-InstallDirectory', "`"$installRoot`"",
            '-ExecutablePath', "`"$(Join-Path $installRoot 'Porto.exe')`"",
            '-ErrorFile', "`"$updateError`"",
            '-ReadyFile', "`"$updateReady`"",
            '-ProceedFile', "`"$updateProceed`"",
            '-SkipRestart'
          )
          $updateProcess = Start-Process powershell.exe -ArgumentList $updateArguments -PassThru -WindowStyle Hidden
          for ($attempt = 0; $attempt -lt 300 -and -not (Test-Path $updateReady); $attempt++) {
            if ($updateProcess.HasExited) {
              throw "In-place update helper exited before readiness with code $($updateProcess.ExitCode)."
            }
            Start-Sleep -Milliseconds 50
          }
          if (-not (Test-Path $updateReady)) {
            Stop-Process -Id $updateProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'In-place update helper did not become ready.'
          }
          Set-Content $updateProceed 'proceed'
          $updateProcess.WaitForExit()
          if ($updateProcess.ExitCode -ne 0) {
            throw "In-place update helper exited with code $($updateProcess.ExitCode)."
          }
          if (Test-Path $updateError) {
            throw "In-place update helper reported: $(Get-Content -Raw $updateError)"
          }
          if (-not (Test-Path (Join-Path $installRoot 'Porto.exe'))) {
            throw 'In-place update helper removed Porto.exe.'
          }
          $uninstaller = Get-ChildItem $installRoot -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) {
            throw 'Installer did not create an uninstaller.'
          }
          $process = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($process.ExitCode)."
          }

      - name: Upload native installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-installers-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
