name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Guard the minimum toolchain declared in go.mod.
          - os: ubuntu-latest
            go: '1.25.x'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Check gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/porto

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./... -count=1

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/porto
            echo "::endgroup::"
          done

  ui:
    name: UI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported by Vite/oxlint, active LTS, and current.
        node: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
