name: Security audit

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          check-latest: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Reject deprecated OpenPGP imports
        run: node scripts/check-go-crypto.cjs

  npm-audit:
    name: Dashboard dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false

      - name: Audit dependencies
        # Fails on every high or critical advisory except the unpatched ones scripts/npm-audit-policy.cjs accepts.
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT
          if npm audit --package-lock-only --audit-level=high; then
            exit 0
          fi
          npm audit --package-lock-only --json > "$audit_log" || true
          node ../scripts/npm-audit-policy.cjs < "$audit_log"
