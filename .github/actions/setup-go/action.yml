name: Set up Go with workload-scoped caches
description: Share module downloads without mixing host tests and cross-compiled build caches.
inputs:
  go-version:
    description: Go version or release channel.
    default: stable
  cache-scope:
    description: Build workload and target, independent of the shared module cache.
    default: host
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      id: go
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: porto-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'scripts/bundle-desktop-runtime.sh') }}
        restore-keys: |
          porto-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Go build objects
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: porto-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.sum', 'scripts/bundle-desktop-runtime.sh', 'scripts/patches/*.patch') }}
        restore-keys: |
          porto-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-
