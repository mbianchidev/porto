name: Runtime data acceptance
description: Prepare disposable runtimes and exercise one migration, native, or engine phase.

inputs:
  backend:
    description: Destination runtime backend, local or lima.
    required: true
  phase:
    description: Acceptance phase, migration, native, or engine.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-go
      with:
        cache-scope: runtime-data-${{ inputs.backend }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
    - uses: ./.github/actions/cache-desktop
      with:
        target: runtime-data-${{ inputs.backend }}
    - name: Install Linux native filesystem and VM prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq acl fuse3 libfuse3-dev libglib2.0-dev meson ninja-build pkg-config qemu-system qemu-utils
        sshfs_build="$(mktemp -d "$RUNNER_TEMP/porto-sshfs.XXXXXX")"
        trap 'rm -r -- "$sshfs_build"' EXIT
        bash scripts/download-file.sh \
          https://github.com/libfuse/sshfs/releases/download/sshfs-3.7.6/sshfs-3.7.6.tar.xz "$sshfs_build/source.tar.xz" \
          6a1bcb31450a077e9cb1b7ff158c71de34db697c3c0da6cb362502131e495893
        node scripts/verify-runtime-checksum.cjs --verify \
          6a1bcb31450a077e9cb1b7ff158c71de34db697c3c0da6cb362502131e495893 "$sshfs_build/source.tar.xz"
        tar -xJf "$sshfs_build/source.tar.xz" -C "$sshfs_build"
        meson setup "$sshfs_build/build" "$sshfs_build/sshfs-3.7.6" --prefix=/usr/local --buildtype=release
        meson compile -C "$sshfs_build/build"
        sudo meson install -C "$sshfs_build/build"
        sshfs --help 2>&1 | grep -q contain_symlinks
        if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
        test -c /dev/fuse
        if [ -c /dev/kvm ]; then
          sudo usermod -aG kvm "$(id -un)"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
        fi
    - name: Install macOS VM prerequisite
      if: runner.os == 'macOS'
      shell: bash
      run: brew install qemu
    - name: Install Windows packaging prerequisites
      if: runner.os == 'Windows'
      shell: bash
      run: npm --prefix ui/electron ci
    - name: Install the explicitly selected Windows native filesystem driver
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/install-winfsp-ci.ps1
    - name: Exercise real migration, mounts and recovery
      shell: bash
      env:
        PORTO_RUNTIME_DATA_BACKEND: ${{ inputs.backend }}
        PORTO_RUNTIME_DATA_PHASE: ${{ inputs.phase }}
      run: |
        case "$PORTO_RUNTIME_DATA_BACKEND" in
          local|lima) ;;
          *) echo "Unsupported runtime backend: $PORTO_RUNTIME_DATA_BACKEND" >&2; exit 1 ;;
        esac
        if [ "$PORTO_RUNTIME_DATA_BACKEND" = local ]; then
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_TEMP=$RUNNER_TEMP" \
            "RUNNER_ARCH=$RUNNER_ARCH" "GOTOOLCHAIN=${GOTOOLCHAIN:-auto}" \
            "PORTO_RUNTIME_DATA_PHASE=$PORTO_RUNTIME_DATA_PHASE" \
            "PORTO_DOWNLOAD_CACHE=${PORTO_DOWNLOAD_CACHE:-}" \
            bash scripts/test-docker-clients.sh local data
        elif [ "$RUNNER_OS" = Linux ] && [ -c /dev/kvm ]; then
          sg kvm -c 'bash scripts/test-docker-clients.sh lima data'
        elif [ "$RUNNER_OS" = macOS ]; then
          nice -n 10 bash scripts/test-docker-clients.sh lima data
        else
          bash scripts/test-docker-clients.sh lima data
        fi
