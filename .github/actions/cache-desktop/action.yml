name: Cache desktop build downloads
description: Cache verified runtime inputs and Electron downloads, never packaged apps or VM state.
inputs:
  target:
    description: Runtime target or desktop test workload.
    required: true
runs:
  using: composite
  steps:
    - name: Locate job-scoped desktop download caches
      id: locations
      shell: bash
      run: |
        echo "PORTO_DOWNLOAD_CACHE=$RUNNER_TEMP/porto-download-cache" >> "$GITHUB_ENV"
        echo "PORTO_CI_APT_CACHE=$RUNNER_TEMP/porto-ci-apt-cache" >> "$GITHUB_ENV"
        node -e "console.log('snapshot=' + require('./scripts/ci-ubuntu-snapshot.cjs').snapshotID())" >> "$GITHUB_OUTPUT"
        node <<'NODE' >> "$GITHUB_ENV"
        const os = require('node:os')
        const path = require('node:path')
        const base = process.platform === 'darwin'
          ? path.join(os.homedir(), 'Library', 'Caches')
          : process.platform === 'win32'
            ? process.env.LOCALAPPDATA
            : path.join(os.homedir(), '.cache')
        if (!base) throw new Error('Unable to locate desktop download caches')
        const suffix = process.platform === 'win32' ? ['Cache'] : []
        console.log(`PORTO_ELECTRON_CACHE=${path.join(base, 'electron', ...suffix)}`)
        console.log(`PORTO_ELECTRON_BUILDER_CACHE=${path.join(base, 'electron-builder', ...suffix)}`)
        NODE

    - name: Cache verified runtime and Electron downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/porto-download-cache
          ${{ env.PORTO_ELECTRON_CACHE }}
          ${{ env.PORTO_ELECTRON_BUILDER_CACHE }}
        key: porto-desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ui/electron/package-lock.json', 'scripts/bundle-desktop-runtime.sh', 'scripts/bundle-synchronization-runtime.sh', 'scripts/bundle-windows-containers.sh', 'scripts/windows-container-toolchain.cjs', 'scripts/download-file.sh', 'scripts/test-docker-clients.sh') }}

    - name: Cache immutable signed Ubuntu snapshot inputs
      if: startsWith(inputs.target, 'development-') || startsWith(inputs.target, 'runtime-data-') || startsWith(inputs.target, 'linux-') || startsWith(inputs.target, 'darwin-') || startsWith(inputs.target, 'windows-')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PORTO_CI_APT_CACHE }}
        key: porto-ci-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.locations.outputs.snapshot }}
        restore-keys: |
          porto-ci-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.locations.outputs.snapshot }}-
