version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # v0.32.0+ moved to cel.dev/cel-go; the old path stays only for Kubernetes deps.
      - dependency-name: github.com/google/cel-go
        versions: ['>= 0.32.0']
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dashboard:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ui/electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: undici
        update-types: ['version-update:semver-major']
    groups:
      desktop:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
